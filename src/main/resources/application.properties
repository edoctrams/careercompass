spring.application.name=CareerCompass

# Supabase PostgreSQL Connection (Session Pooler on port 5432 of pooler host)
# These values are loaded from .env file via run.sh
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=8

# Flyway Migrations (baseline existing Supabase schema at v0 before applying V1+)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial existing Supabase schema
spring.flyway.locations=classpath:db/migration

# Hibernate / JPA (validate schema against Flyway-managed PostgreSQL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Security (removed hardcoded credentials - use environment)
