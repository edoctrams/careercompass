<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — Career Compass</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh; background-color: var(--bg-page);">
  <!-- Header Fragment -->
  <div th:replace="~{fragments/header :: header}"></div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="card p-4"
      style="max-width: 580px; width: 100%; padding: 2.5rem; border: 1px solid var(--border); box-shadow: var(--shadow-md);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div
          style="width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--primary); display: inline-flex; align-items: center; justify-content: center; color: white; margin-bottom: 1rem; box-shadow: var(--shadow-sm);">
          <i class="fas fa-user-plus" style="font-size: 1.3rem;"></i>
        </div>
        <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;">Create
          Student Account</h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Begin your personalized career
          roadmap & placement preparation</p>
      </div>

      <!-- Error Banner -->
      <div th:if="${registerError}" class="card p-3 mb-3"
        style="background-color: var(--danger-light); border-color: var(--danger-border); color: var(--danger-text); font-size: 0.85rem; display: flex; align-items: center; gap: 0.75rem;">
        <i class="fas fa-exclamation-circle" style="font-size: 1.1rem;"></i>
        <span th:text="${registerError}">Registration error</span>
      </div>

      <!-- Registration Form -->
      <form action="/register" method="POST" id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <div class="input-with-icon">
            <i class="far fa-user input-icon"></i>
            <input type="text" id="reg-name" name="name" class="form-control" placeholder="Parth Kapoor"
              th:value="${registerRequest != null ? registerRequest.name : ''}" required autofocus>
          </div>
        </div>

  <div class="form-group">
    <label class="form-label" for="reg-email">Email Address</label>
    <div class="input-with-icon">
      <i class="far fa-envelope input-icon"></i>
      <input type="email" id="reg-email" name="email" class="form-control" placeholder="student@campus.edu"
        th:value="${registerRequest != null ? registerRequest.email : ''}" required>
    </div>
    <span class="form-helper">We will never share your credentials with third parties.</span>
  </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="Min. 8 characters"
            minlength="8" required>
          <button type="button" class="input-password-toggle" aria-label="Toggle password">
            <i class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm-password">Confirm Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="reg-confirm-password" name="confirmPassword" class="form-control"
            placeholder="Repeat password" required>
        </div>
      </div>
    </div>

      <!-- Password Strength Meter -->
      <div style="margin-bottom: 1.25rem; margin-top: -0.5rem;">
        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.25rem;">
          <span style="color: var(--text-muted);">Password Strength</span>
          <span id="password-strength-label" style="font-weight: 600; color: var(--text-muted);">Too weak</span>
        </div>
          <div class="progress-container" style="height: 5px;">
            <div id="password-strength-bar" class="progress-bar" style="width: 0%; background: var(--border);"></div>
          </div>
        </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="reg-branch">College Branch</label>
              <select id="reg-branch" name="branch" class="form-select" required>
                <option value="Computer Science">Computer Science (CSE)</option>
                <option value="Computer Engineering">Computer Engineering (COE)</option>
                <option value="Information Technology">Information Technology (IT)</option>
                <option value="Electronics and Communication">Electronics & Comm. (ECE)</option>
                <option value="Electrical Engineering">Electrical Engineering (EE)</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Other">Other Branch</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-grad-year">Graduation Year</label>
              <select id="reg-grad-year" name="graduationYear" class="form-select" required>
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
              </select>
            </div>
          </div>

  <div class="form-group">
    <label class="form-label" for="reg-hours">Daily Available Study Hours</label>
    <div class="input-with-icon">
      <i class="far fa-clock input-icon"></i>
      <input type="number" id="reg-hours" name="dailyAvailableHours" class="form-control" min="1" max="16" value="3"
        required>
    </div>
    <span class="form-helper">This helps calibrate your weekly task workload.</span>
  </div>

  <button type="submit" class="btn btn-primary w-100" style="padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
    <i class="fas fa-check-circle me-2"></i> Create Account & Proceed to Onboarding
  </button>
  </form>

  <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-secondary);">
    Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600;">Sign in here</a>
  </div>
  </div>
  </main>

  <!-- Footer Fragment -->
  <div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>

</html>
