<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Sidebar Fragment -->
  <aside th:fragment="sidebar">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="sidebar" id="sidebar">
      <!-- Header / Logo -->
      <div class="sidebar-header">
        <a href="/" class="brand-link">
          <div class="brand-icon">
            <i class="fas fa-compass"></i>
          </div>
          <span class="brand-title">Career Compass</span>
        </a>
        <button type="button" class="btn btn-ghost btn-icon mobile-sidebar-close" id="sidebar-close-btn" aria-label="Close sidebar" style="display: none;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <!-- Overview Section -->
        <div class="nav-section-title">OVERVIEW</div>
        <a href="/dashboard" class="sidebar-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
          <i class="fas fa-th-large"></i>
          <span>Dashboard</span>
        </a>

        <!-- Career Development Section -->
        <div class="nav-section-title">CAREER DEVELOPMENT</div>
        <a href="/careers" class="sidebar-link" th:classappend="${activePage == 'careers' ? 'active' : ''}">
          <i class="fas fa-compass"></i>
          <span>Explore Careers</span>
          <span class="nav-badge nav-badge-purple">8 Tracks</span>
        </a>
        <a href="/skill-assessment" class="sidebar-link" th:classappend="${activePage == 'skill-assessment' ? 'active' : ''}">
          <i class="fas fa-sliders-h"></i>
          <span>Skill Assessment</span>
        </a>
        <a href="/roadmap" class="sidebar-link" th:classappend="${activePage == 'roadmap' ? 'active' : ''}">
          <i class="fas fa-route"></i>
          <span>My Roadmap</span>
        </a>
        <a href="/daily-tasks" class="sidebar-link" th:classappend="${activePage == 'daily-tasks' ? 'active' : ''}">
          <i class="fas fa-tasks"></i>
          <span>Daily Tasks</span>
        </a>
        <a href="/job-description" class="sidebar-link" th:classappend="${activePage == 'job-description' ? 'active' : ''}">
          <i class="fas fa-file-invoice"></i>
          <span>JD Analysis</span>
          <span class="nav-badge nav-badge-blue">AI-Match</span>
        </a>
        <a href="/resources" class="sidebar-link" th:classappend="${activePage == 'resources' ? 'active' : ''}">
          <i class="fas fa-book-open"></i>
          <span>Learning Resources</span>
        </a>
        <a href="/projects" class="sidebar-link" th:classappend="${activePage == 'projects' ? 'active' : ''}">
          <i class="fas fa-laptop-code"></i>
          <span>Projects</span>
        </a>

        <!-- Placement Preparation Section -->
        <div class="nav-section-title">PLACEMENT PREPARATION</div>
        <a href="/question-sets" class="sidebar-link" th:classappend="${activePage == 'question-sets' ? 'active' : ''}">
          <i class="fas fa-layer-group"></i>
          <span>Question Bank</span>
          <span class="nav-badge nav-badge-green">Practice</span>
        </a>
        <a href="/companies" class="sidebar-link" th:classappend="${activePage == 'companies' ? 'active' : ''}">
          <i class="fas fa-building"></i>
          <span>Companies</span>
        </a>
        <a href="/interview-experiences" class="sidebar-link" th:classappend="${activePage == 'interview-experiences' ? 'active' : ''}">
          <i class="fas fa-comments"></i>
          <span>Interview Experiences</span>
        </a>

        <!-- Tracking Section -->
        <div class="nav-section-title">TRACKING</div>
        <a href="/progress" class="sidebar-link" th:classappend="${activePage == 'progress' ? 'active' : ''}">
          <i class="fas fa-chart-line"></i>
          <span>My Progress</span>
        </a>

        <!-- Account Section -->
        <div class="nav-section-title">ACCOUNT</div>
        <a href="/profile" class="sidebar-link" th:classappend="${activePage == 'profile' ? 'active' : ''}">
          <i class="fas fa-user-circle"></i>
          <span>Profile</span>
        </a>
        <a href="/settings" class="sidebar-link" th:classappend="${activePage == 'settings' ? 'active' : ''}">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </a>
        <form action="/logout" method="POST" style="margin: 0.25rem 0 0;">
          <button type="submit" class="sidebar-link w-100 text-start" style="background: none; border: none; cursor: pointer;">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </button>
        </form>
      </nav>
    </div>
  </aside>
</body>
</html>
