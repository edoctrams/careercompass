<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Header Fragment (Light-First Modern SaaS) -->
  <header th:fragment="header" class="topbar">
    <div class="topbar-left">
      <button type="button" class="mobile-toggle-btn" id="mobile-sidebar-toggle" aria-label="Toggle navigation menu">
        <i class="fas fa-bars"></i>
      </button>

      <nav class="breadcrumb-nav d-none d-md-flex" aria-label="Breadcrumb">
        <a th:href="@{/dashboard}"><i class="fas fa-compass text-muted me-1"></i> Career Compass</a>
        <span class="breadcrumb-separator"><i class="fas fa-chevron-right"></i></span>
        <span class="breadcrumb-active" th:text="${activePage != null ? #strings.capitalize(activePage) : 'Dashboard'}">Dashboard</span>
      </nav>
    </div>

    <div class="topbar-right">
      <!-- Authenticated User Menu -->
      <th:block th:if="${isAuthenticated}">
        <!-- Notification Button -->
        <button type="button" class="btn btn-ghost btn-sm" aria-label="Notifications" onclick="window.showToast('You have active preparation tasks scheduled for today.', 'info')" style="color: var(--text-muted); font-size: 1rem; padding: 0.4rem 0.6rem;">
          <i class="far fa-bell"></i>
        </button>

        <!-- User Profile Dropdown -->
        <div class="user-menu">
          <button type="button" class="user-profile-btn" id="user-menu-btn" aria-haspopup="true" aria-expanded="false">
            <div class="user-avatar" th:text="${currentUserName != null && !currentUserName.isEmpty() ? #strings.substring(currentUserName, 0, 1).toUpperCase() : 'S'}">S</div>
            <span class="user-name d-none d-md-inline" th:text="${currentUserName != null ? currentUserName : 'Student'}">Student</span>
            <i class="fas fa-chevron-down ms-1" style="font-size: 0.65rem; color: var(--text-muted);"></i>
          </button>

          <div class="dropdown-menu" id="user-dropdown">
            <div class="dropdown-header">
              <div class="dropdown-header-name" th:text="${currentUserName != null ? currentUserName : 'Student User'}">Student User</div>
              <div class="dropdown-header-email" th:text="${currentUserEmail != null ? currentUserEmail : 'student@campus.edu'}">student@campus.edu</div>
            </div>
            <a class="dropdown-item" th:href="@{/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a class="dropdown-item" th:href="@{/profile}"><i class="fas fa-user-circle"></i> Profile & Career Goal</a>
            <a class="dropdown-item" th:href="@{/settings}"><i class="fas fa-cog"></i> Settings & Pacing</a>
            <div class="dropdown-divider"></div>
            <form th:action="@{/logout}" method="POST" style="margin: 0;">
              <button type="submit" class="dropdown-item text-danger w-100 text-start" style="background: none; border: none; font-family: inherit; cursor: pointer;">
                <i class="fas fa-sign-out-alt"></i> Sign Out
              </button>
            </form>
          </div>
        </div>
      </th:block>

      <!-- Unauthenticated Menu Buttons -->
      <th:block th:unless="${isAuthenticated}">
        <a th:href="@{/login}" class="btn btn-ghost btn-sm">Sign In</a>
        <a th:href="@{/register}" class="btn btn-primary btn-sm">Get Started</a>
      </th:block>
    </div>
  </header>
</body>
</html>
