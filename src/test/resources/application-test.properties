# H2 In-memory database for tests only
spring.datasource.url=jdbc:h2:mem:careercompass_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver

# Disable Flyway for H2 tests (PostgreSQL-specific migrations)
spring.flyway.enabled=false

# Hibernate / JPA for tests
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable H2 console for tests
spring.h2.console.enabled=false
